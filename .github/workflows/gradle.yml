name: Build MCNative 1.0-SNAPSHOT
on:
  workflow_dispatch:

# Добавляем блок permissions для всего воркфлоу
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'liberica'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MCNativeBuilder
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-snapshot
          name: "MCNativeBuilder 1.0-SNAPSHOT"
          draft: true
          files: build/libs/MCNativeBuilder-1.0-SNAPSHOT-all.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
